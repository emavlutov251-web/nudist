# Полный сервер «Нудиста» одной командой: мессенджер + https + сервер для звонков.
#
#   cp .env.example .env      # вписать адрес, IP и секрет
#   docker compose up -d      # запустить
#   docker compose logs -f    # журнал
#   docker compose pull && docker compose up -d --build   # обновить
#
# PostgreSQL и Redis здесь нет намеренно: мессенджер ими не пользуется, база — файл в томе nudist-data.

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      TURN_HOST: ${DOMAIN}
      TURN_SECRET: ${TURN_SECRET}
    volumes:
      - nudist-data:/data
    expose:
      - "3000"
    stop_grace_period: 20s

  # https: сертификат Caddy получает и продлевает сам.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    command: caddy reverse-proxy --from ${DOMAIN} --to app:3000
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  # TURN: без него звонки не проходят между мобильными сетями. Ему нужна сеть хоста (диапазон UDP-портов).
  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    network_mode: host
    command:
      - -n
      - --listening-port=3478
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET}
      - --realm=${DOMAIN}
      - --external-ip=${PUBLIC_IP}
      - --min-port=49160
      - --max-port=49400
      - --total-quota=200
      - --stale-nonce=600
      - --no-cli
      - --no-tls
      - --no-dtls
      - --no-multicast-peers
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --log-file=stdout

volumes:
  nudist-data:
  caddy-data:
  caddy-config:
