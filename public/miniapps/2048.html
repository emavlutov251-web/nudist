<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>2048</title>
<link rel="stylesheet" href="/miniapps/kit.css">
<link rel="stylesheet" href="/miniapps/2048.css">
<script type="module" src="/miniapps/2048.js"></script>
</head>
<body>
<main>
  <div class="row"><div class="stat"><small>Счёт</small><b id="score">0</b></div><div class="stat"><small>Рекорд</small><b id="best">0</b></div><button id="new" type="button">Заново</button></div>
  <div id="board" aria-label="Поле 4 на 4"></div>
  <p class="dim center" id="hint">Свайпы или стрелки. Одинаковые плитки складываются.</p>
  <p class="dim center"><svg class="mi-ic" viewBox="0 0 24 24" width="1em" height="1em" aria-hidden="true"><path d="M12 3C8.5 6.5 7 11 8.5 15c1.2 3.2 4 4.6 7 4.9 1-2.2.8-5 .2-7.7C14.4 8.3 13.6 5.6 12 3Z" fill="#3DB96A" stroke="#173F2C" stroke-width="1.6" stroke-linejoin="round"/></svg> Листики за плитки: 128 → 1, 256 → 2, 512 → 3, 1024 → 5, 2048 → 10. До 15 в день.</p>
  <button id="share" class="pri" type="button">Похвастаться в чате</button>
</main>
