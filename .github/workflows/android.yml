# Сборка приложения для Android из исходников. Запускается, когда меняется android/ или интерфейс (public/):
# интерфейс зашивается внутрь APK (assets/public), поэтому правка public/js тоже требует новой сборки.
# Подпись постоянная: ключ лежит в секретах репозитория (NUDIST_KEYSTORE_B64, NUDIST_KEYSTORE_PASS) и
# восстанавливается в файл перед сборкой. Без этого нельзя: RuStore принимает обновление только с той же
# подписью, а одноразовый ключ (как было до 1.9) ломает обновления поверх установленного приложения.
# Полученный файл и отпечаток сертификата остаются в артефакте сборки.
name: Сборка Android

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'public/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: APK собирается
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'
      - name: Восстановить ключ подписи
        env:
          KEY_B64: ${{ secrets.NUDIST_KEYSTORE_B64 }}
        run: |
          cd android
          [ -n "$KEY_B64" ] || { echo "::error::В секретах нет NUDIST_KEYSTORE_B64 — сборка была бы подписана чужим ключом"; exit 1; }
          echo "$KEY_B64" | base64 -d > nudist.keystore
          chmod 600 nudist.keystore
      - name: Собрать и проверить подпись
        env:
          NUDIST_KEYSTORE_PASS: ${{ secrets.NUDIST_KEYSTORE_PASS }}
        run: |
          cd android
          ANDROID_SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}" SERVER_URL=https://95-174-95-148.sslip.io MIGRATE_FROM=https://nudist.onrender.com bash ./build.sh
          echo "=== отпечаток сертификата (должен всегда совпадать) ==="
          "$ANDROID_SDK"/build-tools/34.0.0/apksigner verify --print-certs nudist-android.apk | grep SHA-256 | head -1
          echo "=== файл для выкладки ==="
          cp nudist-android.apk ../public/nudist.apk
      - uses: actions/upload-artifact@v4
        with:
          name: nudist-apk
          path: |
            android/nudist-android.apk
            public/nudist.apk
          if-no-files-found: error
