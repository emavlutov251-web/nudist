# Проверка, что приложение для Android собирается из исходников. Запускается, когда меняется папка android/.
# Подпись здесь временная: боевую сборку подписывает владелец своим ключом (android/nudist.keystore в репозиторий не входит).
name: Сборка Android

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: APK собирается
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'
      - name: Собрать и проверить подпись
        run: |
          cd android
          rm -f nudist.keystore
          ANDROID_SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}" NUDIST_KEYSTORE_PASS=temporary-ci-key SERVER_URL=https://example.org MIGRATE_FROM=https://old.example.org bash ./build.sh
