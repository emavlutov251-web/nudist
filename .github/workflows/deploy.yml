# Каждый push в main: проверка кода → сборка Docker-образа → сдвиг ветки release; свой сервер сам забирает её раз в две минуты.
name: Проверка и выкладка

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'public/**'
      - 'scripts/**'
      - 'ENV.md'
      - 'README.md'
      - 'deploy/**'
      - 'package.json'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Проверка
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Синтаксис сервера и клиента
        run: |
          for f in server/*.js; do node --check "$f"; done
          for f in public/js/*.js; do cp "$f" /tmp/check.mjs && node --check /tmp/check.mjs || { echo "::error file=$f::синтаксическая ошибка"; exit 1; }; done
      - name: Целостность проекта (библиотеки на месте, методы интерфейса есть на сервере, переменные описаны, версия Android)
        run: node scripts/check-project.js
      - name: Главный путь (регистрация, вход, WebSocket, файлы)
        run: node scripts/smoke.js
      - name: Безопасность (чужие чаты, админка, файлы, вход, первый запуск)
        run: node scripts/security-test.js
      - name: Механики (листики, магазин, энергия, капсулы, чаевые, рекорды, лобби, лента, сброс пароля)
        run: node scripts/mechanics-test.js
      - name: «Редакция сообщества» (план постов по календарю)
        run: node scripts/community-test.js
      - name: Docker-образ собирается и запускается
        run: |
          docker build -t nudist:ci .
          docker run -d --name nudist-ci -p 3000:3000 nudist:ci
          for i in $(seq 1 20); do curl -fsS --max-time 3 http://127.0.0.1:3000/api/health && exit 0; sleep 1; done
          docker logs nudist-ci; exit 1

  release:
    name: Выпуск на свой сервер
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Свой сервер (deploy/auto-update.sh) сам забирает ветку release раз в две минуты. Двигаем её только после успешных проверок.
      - name: Сдвинуть ветку release на проверенный коммит
        run: git push --force origin "$GITHUB_SHA:refs/heads/release"

